[package]
name = "autocommit-rs"
version = "0.1.3"
edition = "2024"
description = "Tool that generates conventional commits from staged changes and executes the commit in one go."
license = "MIT"
repository = "https://github.com/wthrajat/autocommit-rs"
homepage = "https://github.com/wthrajat/autocommit-rs"
documentation = "https://docs.rs/autocommit-rs"
authors = ["Rajat Khanduri <logsinx@proton.me> (https://wthrajat.com)"]
keywords = ["git", "commit", "conventional-commits", "cli", "automation"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "autocommit"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
colored = "3"
dialoguer = { version = "0.11", features = ["password"] }
dotenvy = "0.15"
indicatif = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["http2", "json", "rustls-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "time"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
